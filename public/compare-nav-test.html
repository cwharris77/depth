<!doctype html>
<html>
<head><title>Compare nav test</title></head>
<body>
<iframe id="f" src="/compare?a=seahawks&b=49ers&pos=WR" style="width:800px;height:600px;border:1px solid #333;"></iframe>
<div id="log"></div>
<script>
const f = document.getElementById('f');
const logDiv = document.getElementById('log');
function log(s) {
  const p = document.createElement('p');
  p.textContent = s;
  logDiv.appendChild(p);
}
let step = 0;
f.onload = function () {
  try {
    const win = f.contentWindow;
    if (step === 0) {
      log('loaded: ' + win.location.href);
      const text = win.document.body.innerText;
      log('has SEAHAWKS: ' + text.includes('SEAHAWKS'));
      log('has 49ERS: ' + text.includes('49ERS'));
      log('has Jaxon: ' + text.includes('Jaxon'));
      setTimeout(() => {
        if (win.next && win.next.router && win.next.router.push) {
          log('navigating via next.router.push');
          win.next.router.push('/team/seahawks?player=4430878');
        } else {
          log('no next.router.push; using location.assign');
          win.location.assign('/team/seahawks?player=4430878');
        }
      }, 1000);
      step = 1;
    } else if (step === 1) {
      log('after nav: ' + win.location.href);
      setTimeout(() => {
        win.history.back();
        step = 2;
      }, 1500);
    } else if (step === 2) {
      log('after back: ' + win.location.href);
      const text = win.document.body.innerText;
      log('has SEAHAWKS: ' + text.includes('SEAHAWKS'));
      log('has 49ERS: ' + text.includes('49ERS'));
      log('has Jaxon: ' + text.includes('Jaxon'));
    }
  } catch (e) {
    log('error: ' + e.message);
  }
};
</script>
</body>
</html>
