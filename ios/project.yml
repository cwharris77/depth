name: Depth
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: debug
  Release: release

configFiles:
  Debug: xcconfig/Debug.xcconfig
  Staging: xcconfig/Staging.xcconfig
  Release: xcconfig/Release.xcconfig

packages:
  # Exact pin, not `from:` — a reviewed version per the design spec, not an
  # up-to-next-major range that could silently pick up an unreviewed release.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1

targets:
  Depth:
    type: application
    platform: iOS
    sources:
      - path: Depth/App
      - path: Depth/Domain
      - path: Depth/Data
      - path: Depth/Features
      - path: Depth/Support
      - path: Depth/Assets.xcassets
      - path: Depth/LaunchScreen.storyboard
    info:
      path: Depth/Info.plist
      properties:
        CFBundleDisplayName: Depth
        # Native launch screen (DEP-160): a launch storyboard — the #0A0E1A background
        # (LaunchBackground color set) with the depth mark centered on it. Storyboard
        # rather than UILaunchScreen.UIImageName: the plist image key does not render on
        # current iOS (verified on the iOS 26 simulator), while the storyboard's image
        # view loads the same asset through the normal image-loading path.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        # Cooper's Apple Developer Team ID — needed to sign on-device/test builds. It's a
        # public identifier (not a credential), so it's safe to commit; XcodeGen keeps the
        # regenerated project in sync with this, so the CI project-sync check stays green.
        DEVELOPMENT_TEAM: 63JZBB528Q
    dependencies:
      - package: Supabase
        product: Supabase

  DepthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DepthTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Depth
      - package: Supabase
        product: Supabase

  DepthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DepthUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Depth

schemes:
  Depth:
    build:
      targets:
        Depth: all
        DepthTests: [test]
        DepthUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DepthTests
        - name: DepthUITests
          # AppStoreScreenshotsUITests is a slow, human-triggered release-prep tool
          # (task-9d-screenshots-brief.md), not a correctness gate — excluded here so
          # the default `xcodebuild test` run (this scheme's plain `test` action,
          # which is what ios-ci.yml's `test` job runs) skips it. `-only-testing` at
          # invocation time cannot override a scheme-level skip, so running it directly
          # needs project.yml regenerated without this entry — see
          # docs/ios-appstore-screenshots.md for the documented local workflow.
          skippedTests:
            - AppStoreScreenshotsUITests
    archive:
      config: Release
