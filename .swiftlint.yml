# Bug-pattern rules only -- style is handled by swift-format (.swift-format), not SwiftLint.
# Warnings, never errors: these flag risk for an agent to look at, they don't gate a PR
# (DEP-604). Add a rule only if it catches a defect, not a style preference.
included:
  - Depth
only_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - unhandled_throwing_task
  - unused_closure_parameter
  - weak_delegate
  - class_delegate_protocol
  - discarded_notification_center_observer
  - unowned_variable_capture
  - notification_center_detachment
  - overridden_super_call
