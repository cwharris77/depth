name: Auto-label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const typeLabels = {
              feat: 'feature',
              fix: 'bug',
              docs: 'documentation',
              refactor: 'refactor',
              style: 'style',
              perf: 'performance',
              test: 'tests',
              build: 'ci',
              ci: 'ci',
              chore: 'chore',
              revert: 'bug',
              a11y: 'a11y'
            };

            const prTitle = context.payload.pull_request.title;
            const match = prTitle.match(/^(feat|fix|docs|refactor|style|perf|test|build|ci|chore|revert|a11y)(\(.+\))?!?:/);
            const labels = new Set();
            if (match && typeLabels[match[1]]) {
              labels.add(typeLabels[match[1]]);
            }

            if (labels.size === 0) return;

            const { data: existing } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existingLabels = existing.labels.map(l => l.name);
            const toAdd = [...labels].filter(l => !existingLabels.includes(l));

            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: toAdd
              });
              console.log(`Applied labels: ${[...labels].join(', ')}`);
            }
