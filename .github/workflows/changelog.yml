name: Update Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get last tag
        id: last-tag
        run: |
          TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: gen
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 100
            });

            const typeMap = {
              feat: '### Features',
              fix: '### Bug Fixes',
              docs: '### Documentation',
              refactor: '### Refactoring',
              a11y: '### Accessibility',
              perf: '### Performance',
              test: '### Tests',
              ci: '### CI',
              chore: '### Chores',
              style: '### Style',
              build: '### Build'
            };

            const sections = {};
            for (const c of commits) {
              const msg = c.commit.message.split('\n')[0].trim();
              const m = msg.match(/^(feat|fix|docs|refactor|style|perf|test|build|ci|chore|a11y)(\(.+\))?!?:\s*(.*)/);
              if (m) {
                const type = m[1];
                const desc = m[3];
                const scope = m[2] ? m[2].slice(1, -1) : '';
                const section = typeMap[type] || '### Other';
                if (!sections[section]) sections[section] = [];
                sections[section].push('- ' + desc + ' (' + (scope || 'general') + ')');
              }
            }

            const order = ['### Features', '### Bug Fixes', '### Documentation', '### Refactoring', '### Accessibility', '### Performance', '### Tests', '### CI', '### Chores', '### Style', '### Build', '### Other'];
            const parts = order.filter(s => sections[s]);
            if (parts.length === 0) {
              core.setOutput('changes', '');
              return;
            }

            const changes = parts.map(s => s + '\n\n' + sections[s].join('\n')).join('\n');
            core.setOutput('changes', changes);

      - name: Update CHANGELOG.md
        if: steps.gen.outputs.changes != ''
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d")
          LAST_TAG="${{ steps.last-tag.outputs.tag }}"
          cat > CHANGELOG.md <<EOF
# Changelog

All notable changes to The Sticks will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Conventional Commits](https://www.conventionalcommits.org/).

## [Unreleased]

${{ steps.gen.outputs.changes }}

## [${LAST_TAG}] - ${TIMESTAMP}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update release notes [skip ci]"
          git push
