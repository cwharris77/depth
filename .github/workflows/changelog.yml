name: Update Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'

concurrency:
  group: changelog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get last tag
        id: last-tag
        run: |
          TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: gen
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 100
            });

            const typeMap = {
              feat: '### Features',
              fix: '### Bug Fixes',
              docs: '### Documentation',
              refactor: '### Refactoring',
              a11y: '### Accessibility',
              perf: '### Performance',
              test: '### Tests',
              ci: '### CI',
              chore: '### Chores',
              style: '### Style',
              build: '### Build'
            };

            const sections = {};
            for (const c of commits) {
              const msg = c.commit.message.split('\n')[0].trim();
              const m = msg.match(/^(feat|fix|docs|refactor|style|perf|test|build|ci|chore|a11y)(\(.+\))?!?:\s*(.*)/);
              if (m) {
                const type = m[1];
                const desc = m[3];
                const scope = m[2] ? m[2].slice(1, -1) : '';
                const section = typeMap[type] || '### Other';
                if (!sections[section]) sections[section] = [];
                sections[section].push('- ' + desc + ' (' + (scope || 'general') + ')');
              }
            }

            const order = ['### Features', '### Bug Fixes', '### Documentation', '### Refactoring', '### Accessibility', '### Performance', '### Tests', '### CI', '### Chores', '### Style', '### Build', '### Other'];
            const parts = order.filter(s => sections[s]);
            if (parts.length === 0) {
              core.setOutput('changes', '');
              return;
            }

            const changes = parts.map(s => s + '\n\n' + sections[s].join('\n')).join('\n');
            core.setOutput('changes', changes);

      - name: Update CHANGELOG.md
        if: steps.gen.outputs.changes != ''
        env:
          # Passed through env, never spliced into the script with ${{ }}: `changes` is
          # built from commit subjects, which come from PR titles. An unquoted splice into
          # a shell heredoc let a backtick or $(…) in any title execute on a runner that
          # holds `contents: write`.
          CHANGES: ${{ steps.gen.outputs.changes }}
          LAST_TAG: ${{ steps.last-tag.outputs.tag }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d")
          # printf, not a heredoc: a heredoc body has to sit at column 0 of the *generated*
          # script — i.e. flush with this block scalar's indent — which reads as broken YAML
          # and is exactly what made this file unparseable when it was first added (#661).
          {
            printf '# Changelog\n\n'
            printf 'All notable changes to The Sticks will be documented in this file.\n\n'
            printf 'The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\n'
            printf 'and this project adheres to [Conventional Commits](https://www.conventionalcommits.org/).\n\n'
            printf '## [Unreleased]\n\n'
            printf '%s\n\n' "$CHANGES"
            printf '## [%s] - %s\n' "${LAST_TAG:-Unreleased}" "$TIMESTAMP"
          } > CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # The generated file is identical on most pushes (the commit window below is
          # fixed, not tag-delimited). `git commit` exits 1 with nothing staged, which
          # would fail the run for the normal case.
          if git diff --staged --quiet; then
            echo "CHANGELOG.md unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "docs(changelog): update release notes [skip ci]"
          git push
