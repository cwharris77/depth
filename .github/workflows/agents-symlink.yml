name: Agent instructions symlink

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agents-symlink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every CLAUDE.md has an AGENTS.md symlink beside it
        run: |
          failed=0
          for claude in $(git ls-files '*CLAUDE.md'); do
            dir=$(dirname "$claude")
            agents="$dir/AGENTS.md"
            [ "$dir" = . ] && agents=AGENTS.md
            mode=$(git ls-files -s "$agents" | cut -d' ' -f1)
            if [ "$mode" != 120000 ] || [ "$(readlink "$agents")" != CLAUDE.md ]; then
              echo "::error file=$agents::$agents must be a symlink to CLAUDE.md (git mode 120000, found '${mode:-missing}'). Edit CLAUDE.md, then restore the link with: ln -sf CLAUDE.md AGENTS.md"
              failed=1
            fi
          done
          exit $failed
