name: Agent instructions symlink

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agents-symlink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGENTS.md must stay a symlink to CLAUDE.md so every agent reads the same file. A tool that
      # rewrites AGENTS.md instead of writing through the link turns it into a regular file and
      # silently forks the two copies.
      - name: AGENTS.md is a symlink to CLAUDE.md
        run: |
          mode=$(git ls-files -s AGENTS.md | cut -d' ' -f1)
          if [ "$mode" != 120000 ] || [ "$(readlink AGENTS.md)" != CLAUDE.md ]; then
            echo "::error file=AGENTS.md::AGENTS.md must be a symlink to CLAUDE.md (git mode 120000, found '${mode:-missing}'). Edit CLAUDE.md, then restore the link with: ln -sf CLAUDE.md AGENTS.md"
            exit 1
          fi
