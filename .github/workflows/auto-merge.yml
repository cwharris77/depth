name: Auto-merge (opt-in label)

# Opt-in, per-PR auto-merge. Review a PR, add the `automerge` label, and this merges it
# (squash, delete branch) once every check on it has passed.
#
# Why this exists: GitHub's native auto-merge waits only for *required* status checks, and
# this repo deliberately has none (the active `default` ruleset enforces linear history and
# no force-pushes; `main` has no classic protection). With nothing required, enabling
# auto-merge would merge a PR immediately instead of when CI finishes. This waits on the
# real check results instead, scoped to PRs a maintainer explicitly labeled.
#
# Triggers:
#   - workflow_run: fires as the CI / iOS CI workflows finish; the run polls until every
#     check on the PR settles, then merges (so it also waits out Vercel + slower legs).
#     workflow_run jobs are not attached to the PR as checks, so the poll cannot deadlock
#     on itself.
#   - schedule: a 15-minute sweep for the one gap workflow_run misses — a label added to a
#     PR whose checks already finished (no later check completion to trigger on).
#   - workflow_dispatch: manual kick for a specific sweep.
#
# Security: the job never checks out PR code — it only calls the GitHub API via `gh` — and
# merging requires the `automerge` label, which only collaborators can apply. A fork PR
# therefore cannot self-merge.
#
# Release notes: `automerge` is workflow metadata ONLY. It is deliberately not referenced by
# .github/release.yml, so it cannot affect the auto-generated release notes (a merged PR is
# still categorized by its type label, e.g. `chore` -> Chores). Never add `automerge` to
# release.yml's `categories` or `exclude.labels` — the latter would drop those PRs from the
# notes entirely.
#
# Caveat: the merge uses the Actions GITHUB_TOKEN, and GitHub suppresses workflow runs for
# push events caused by that token — so the post-merge `push` runs of ci.yml / ios-ci.yml
# are skipped. The PR already ran the same checks, so this is expected. Vercel deploys are
# unaffected (the Vercel app's webhook is independent of Actions).

on:
  workflow_run:
    workflows: ['CI', 'iOS CI']
    types: [completed]
  schedule:
    # A 15-minute sweep is only for "labeled after checks already went green"; the normal
    # path (labeled while checks run) fires immediately via workflow_run.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  # One auto-merge run at a time; a queued sweep waits rather than racing a live poll.
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Auto-merge
    # Only act on PR runs, not pushes to main.
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Squash-merge labeled PRs once every check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Merge $1 if it carries the label and every check on it is green. With $2=1
          # (workflow_run) poll until the checks settle; otherwise take one snapshot.
          merge_if_green() {
            local pr="$1" wait="$2"
            local labels
            labels=$(gh pr view "$pr" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || true)
            if ! grep -qx automerge <<<"$labels"; then
              echo "PR #$pr: not labeled automerge — skipping."
              return 0
            fi
            if [ "$(gh pr view "$pr" --repo "$REPO" --json state --jq '.state')" != "OPEN" ]; then
              echo "PR #$pr: not open — skipping."
              return 0
            fi

            local deadline=$(( $(date +%s) + 2400 ))
            while :; do
              local checks failing pending
              checks=$(gh pr checks "$pr" --repo "$REPO" --json name,bucket 2>/dev/null || true)
              [ -n "$checks" ] || checks='[]'
              failing=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$checks")
              pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$checks")

              if [ "$failing" -gt 0 ]; then
                echo "PR #$pr: $failing failing check(s) — not merging."
                return 0
              fi
              if [ "$pending" -eq 0 ]; then
                echo "PR #$pr: every check is green — merging."
                gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
                return 0
              fi
              if [ "$wait" != "1" ] || [ "$(date +%s)" -ge "$deadline" ]; then
                echo "PR #$pr: $pending check(s) still pending — will retry on the next event."
                return 0
              fi
              sleep 30
            done
          }

          if [ "$EVENT" = "workflow_run" ]; then
            pr=$(gh pr list --repo "$REPO" --state open --json number,headRefOid \
                   --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" | head -n1)
            if [ -z "${pr:-}" ]; then
              echo "No open PR for $HEAD_SHA — nothing to do."
              exit 0
            fi
            merge_if_green "$pr" 1
          else
            prs=$(gh pr list --repo "$REPO" --state open --label automerge --json number --jq '.[].number')
            if [ -z "$prs" ]; then
              echo "No open PRs labeled automerge."
              exit 0
            fi
            for pr in $prs; do
              merge_if_green "$pr" 0
            done
          fi
