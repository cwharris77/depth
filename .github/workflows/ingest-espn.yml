name: Ingest ESPN data

# Recurring ESPN ingestion (rosters, depth charts, coaches, and multi-season team
# stats). Wraps `npm run ingest:espn` (see docs/espn.md) on a daily schedule, plus a
# manual trigger. STRICT=1 so a partial run turns the workflow red instead of
# silently going green with half-stale data.

on:
  schedule:
    # Noon PT daily (PST; cron is fixed UTC, so this drifts to ~1pm during PDT --
    # acceptable for a daily refresh, not worth a DST-aware cron for this).
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Season range to backfill team_stats, e.g. 2002-2025. Empty = daily run (this + last season).'
        type: string
        required: false
        default: ''

# Never let two ingestions overlap (a slow run + the next schedule, or a manual
# dispatch during a scheduled one).
concurrency:
  group: ingest-espn
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Sized for a full --seasons backfill (chunked standings fetches across 20+ seasons
    # plus retries), not just the unflagged daily run -- matches ingest-nflverse.yml's
    # timeout for the same reason.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Manual dispatch's `seasons` input backfills team_stats; empty input (the
      # scheduled daily run) falls through to the plain command -- this + last season.
      - run: |
          if [ -n "$SEASONS" ]; then
            npm run ingest:espn -- --seasons "$SEASONS"
          else
            npm run ingest:espn
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Last step on a successful run POSTs to app/api/ingest/revalidate so the
          # deployed app doesn't wait out the `ingest` cacheLife profile's 6h window
          # (2026-08-20-ingest-cache-revalidation-design.md). Missing either var is a
          # silent no-op (notify-revalidate.ts), never a failed run.
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_REVALIDATE_SECRET: ${{ secrets.INGEST_REVALIDATE_SECRET }}
          STRICT: '1'
