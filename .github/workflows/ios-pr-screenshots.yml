name: iOS PR Screenshots

# Agent-triggered on-demand preview capture for iOS PRs — the native analog of checking
# the Vercel build. An agent (or Cooper) triggers it with a PR comment:
#
#   /ios-screenshots
#   /ios-screenshots field,uniform
#
# It builds the PR's app on a GitHub-hosted macOS runner (NOT your Mac — zero local RAM
# hit, and the repo is public so build minutes are unlimited), boots a disposable
# simulator, drives the app to the requested screens via PRScreenshotsUITests, and uploads
# the PNGs as a workflow artifact + posts a PR comment linking to them. The agent then
# reads the PNGs like they'd read a Vercel preview — no shared local simulator pool, no
# booted-sim RAM contention between parallel worktrees.
#
# The default (no target list) is `field` — the depth-chart field surface, the app's
# signature screen.
#
# Timeline: captures the BEFORE set from the PR's base branch, then the AFTER set from
# the PR head — same runner, same simulator, sequential — so you can spot regressions the
# same way /pr-screenshots does on web.
#
# See docs/ios-pr-screenshots.md for the full local workflow (same machinery, run by
# hand) and the comment-trigger reference.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # post the artifact-link comment on the PR

jobs:
  capture:
    # Only react to our own trigger word on PRs. `issue_comment` fires for both issues
    # and PRs; `pull_request` number is only populated for PRs.
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ios-screenshots')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # Hard public-repo guard: only the repo owner (~cwharris77) or a collaborator may
      # trigger this job. Unauthorized commenters FAIL this first step, which aborts the
      # whole job before any macOS build/minutes are spent — without needing `if:` sprawl
      # on every later step. `checkCollaborator` 404s for non-collaborators (and bots).
      - name: Gate on commenter being owner/collaborator
        id: authz
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const login = context.payload.comment.user.login;
            if (login === owner) { return; } // owner is always allowed — nothing to do
            let ok = false;
            try {
              const { data } = await github.rest.repos.checkCollaborator({
                owner, repo, username: login,
              });
              ok = Boolean(data?.permission);
            } catch (e) {
              if (e.status !== 404) throw e; // transient API error → fail loudly, not silently allow
            }
            if (!ok) {
              core.setFailed(`"${login}" is not a collaborator of ${owner}/${repo}; /ios-screenshots is owner/collaborator-only.`);
            }

      - name: Parse requested targets + resolve PR base SHA from comment
        id: targets
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          # /ios-screenshots [t1,t2,...] — second, space-separated arg is the CSV list.
          REST=$(printf '%s' "$BODY" | sed -E 's#^/ios-screenshots[[:space:]]*##; s#[[:space:]]+$##')
          if [ -z "$REST" ]; then
            echo "targets=field" >> "$GITHUB_OUTPUT"
          else
            echo "targets=$REST" >> "$GITHUB_OUTPUT"
          fi

      # `issue_comment` does NOT carry github.event.pull_request (only `issue`), so the
      # PR's base SHA must come from the API keyed on the issue number.
      - name: Resolve PR base SHA via API
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const { data } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr });
            core.setOutput('base_sha', data.base.sha);
            core.setOutput('head_sha', data.head.sha);

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Resolve current-flagship disposable simulator (via ios-ci.yml's resolve)
        id: sim
        run: |
          set -euo pipefail
          TYPES_JSON=$(xcrun simctl list devicetypes -j)
          RUNTIME=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version) | last | .identifier')
          CANDIDATES=$(echo "$TYPES_JSON" | jq -r '
            [.devicetypes[]
              | select(.productFamily == "iPhone" and (.name | test("^iPhone [0-9]+( Pro)?$")))
              | {name, num: (.name | capture("^iPhone (?<n>[0-9]+)") | .n | tonumber)}]
            | sort_by(-.num) | .[].name
          ')
          DEVICE=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if DEVID=$(xcrun simctl create "prshot-$$-$RANDOM" "$candidate" "$RUNTIME" 2>/dev/null); then
              DEVICE="$DEVID"
              break
            fi
          done <<< "$CANDIDATES"
          [ -z "$DEVICE" ] && { echo "::error::no creatable flagship simulator"; exit 1; }
          xcrun simctl boot "$DEVICE"
          echo "device_id=$DEVICE" >> "$GITHUB_OUTPUT"

      # ---- BEFORE: the PR's BASE branch, sequential, same runner/sim.
      - name: Checkout base for before-capture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.base.outputs.base_sha }}
          fetch-depth: 0

      - name: Generate Xcode project from project.yml (base)
        working-directory: ios
        run: |
          xcodegen generate
          # Bake the requested targets into the scheme's TestAction env var — the only
          # channel that reliably reaches the XCUITest runner (project.yml's
          # Depth-PRScreenshots note). The scheme ships with SCREENSHOT_TARGETS=field for
          # CI reproducibility; patch it to the actual targets so field/uniform/player
          # all resolve in the runner.
          perl -0777 -pi -e \
            's#(<EnvironmentVariable\s+key = "SCREENSHOT_TARGETS"\s+value = ")[^"]*(")#$1${{ steps.targets.outputs.targets }}${2}#' \
            Depth.xcodeproj/xcshareddata/xcschemes/Depth-PRScreenshots.xcscheme
          grep 'SCREENSHOT_TARGETS' Depth.xcodeproj/xcshareddata/xcschemes/Depth-PRScreenshots.xcscheme

      - name: Run PR screenshot capture (base / before)
        working-directory: ios
        env:
          SCREENSHOT_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Depth.xcodeproj \
            -scheme Depth-PRScreenshots \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}" \
            -only-testing:DepthUITests/PRScreenshotsUITests \
            -resultBundlePath /tmp/pr-ios-screenshots-before.xcresult \
            test

      - name: Export BEFORE PNGs
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-ios-shots/before
          xcrun xcresulttool export attachments \
            --path /tmp/pr-ios-screenshots-before.xcresult \
            --output-path /tmp/pr-ios-shots/before || \
          xcrun xcresulttool get test-results attachments \
            --path /tmp/pr-ios-screenshots-before.xcresult \
            --output-path /tmp/pr-ios-shots/before
          find /tmp/pr-ios-shots -type f | sort

      # ---- AFTER: the PR HEAD (the head ref), same runner/sim.
      - name: Checkout PR head for after-capture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Use the stable PR head ref (always fetchable, points at the branch's head
          # commit — not a synthetic merge).
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Generate Xcode project from project.yml (head)
        working-directory: ios
        run: |
          xcodegen generate
          # Same target-baking perl patch as the base capture (see the base generate
          # step note).
          perl -0777 -pi -e \
            's#(<EnvironmentVariable\s+key = "SCREENSHOT_TARGETS"\s+value = ")[^"]*(")#$1${{ steps.targets.outputs.targets }}${2}#' \
            Depth.xcodeproj/xcshareddata/xcschemes/Depth-PRScreenshots.xcscheme
          grep 'SCREENSHOT_TARGETS' Depth.xcodeproj/xcshareddata/xcschemes/Depth-PRScreenshots.xcscheme

      - name: Run PR screenshot capture (head / after)
        working-directory: ios
        env:
          SCREENSHOT_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Depth.xcodeproj \
            -scheme Depth-PRScreenshots \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}" \
            -only-testing:DepthUITests/PRScreenshotsUITests \
            -resultBundlePath /tmp/pr-ios-screenshots-after.xcresult \
            test

      - name: Export AFTER PNGs
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-ios-shots/after
          xcrun xcresulttool export attachments \
            --path /tmp/pr-ios-screenshots-after.xcresult \
            --output-path /tmp/pr-ios-shots/after || \
          xcrun xcresulttool get test-results attachments \
            --path /tmp/pr-ios-screenshots-after.xcresult \
            --output-path /tmp/pr-ios-shots/after
          find /tmp/pr-ios-shots -type f | sort

      - name: Upload screenshot artifacts (before + after)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ios-screenshots
          # Both before/ and after/ (empty after/ tolerance: its absence is fine)
          path: |
            /tmp/pr-ios-shots/before/**/*.png
            /tmp/pr-ios-shots/after/**/*.png
          retention-days: 30

      # Upload the screenshots to Cloudinary so they can be embedded inline in the PR
      # comment (data-URI images don't render on GitHub; external image URLs do).
      # Reuses the same unsigned-preset upload as the web /pr-screenshots skill
      # (CLOUDINARY_CLOUD_NAME / CLOUDINARY_UPLOAD_PRESET are the non-secret unsigned
      # values from that setup), under a pr-ios-screenshots/<repo>/<pr> folder. Each PNG
      # is resized to width-500 JPEG so uploads stay small and comments readable.
      - name: Upload screenshots to Cloudinary
        id: upload
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          set -euo pipefail
          # If the unsigned-preset credentials aren't configured as secrets, skip the
          # inline embed and fall back to the artifact-only comment.
          if [ -z "${CLOUDINARY_CLOUD_NAME:-}" ] || [ -z "${CLOUDINARY_UPLOAD_PRESET:-}" ]; then
            echo "::warning::CLOUDINARY_CLOUD_NAME/UPLOAD_PRESET not set — posting artifact-only comment"
            exit 0
          fi
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          PR_NUM=${{ github.event.issue.number }}
          FOLDER="pr-ios-screenshots/$REPO_NAME/$PR_NUM"
          before_png=$(find /tmp/pr-ios-shots/before -name '*.png' | head -1 || true)
          after_png=$(find /tmp/pr-ios-shots/after -name '*.png' | head -1 || true)
          # Resize to width-500 JPEG (sips is built into macOS runners).
          if [ -n "$before_png" ]; then
            sips -Z 500 -s format jpeg -s formatOptions 60 "$before_png" --out /tmp/before-shot.jpg >/dev/null
            URL=$(curl -s -X POST "https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload" \
              -F "file=@/tmp/before-shot.jpg" -F "upload_preset=${CLOUDINARY_UPLOAD_PRESET}" \
              -F "folder=${FOLDER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('secure_url',''))")
            [ -n "$URL" ] && echo "before_url=$URL" >> "$GITHUB_OUTPUT" || echo "::warning::before screenshot upload failed"
          fi
          if [ -n "$after_png" ]; then
            sips -Z 500 -s format jpeg -s formatOptions 60 "$after_png" --out /tmp/after-shot.jpg >/dev/null
            URL=$(curl -s -X POST "https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload" \
              -F "file=@/tmp/after-shot.jpg" -F "upload_preset=${CLOUDINARY_UPLOAD_PRESET}" \
              -F "folder=${FOLDER}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('secure_url',''))")
            [ -n "$URL" ] && echo "after_url=$URL" >> "$GITHUB_OUTPUT" || echo "::warning::after screenshot upload failed"
          fi

      - name: Post PR comment with artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const runId = context.runId;
            const targets = process.env.DEPTH_SHOT_TARGETS || 'field';
            const before = process.env.BEFORE_URL || '';
            const after = process.env.AFTER_URL || '';
            const img = (url, label) => url ? `![${label}](${url})` : `_(${label} unavailable)_`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body:
                `## iOS PR screenshots — \`${targets}\`\n\n` +
                `Captured on a GitHub-hosted runner (no local RAM/Simulator use). ` +
                `**Before** = base branch, **After** = this PR's head; compare the ` +
                `${targets.split(',').length} target(s) for rendering regressions.\n\n` +
                `### Before\n\n${img(before, 'Before')}\n\n` +
                `### After\n\n${img(after, 'After')}\n\n` +
                `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}\n` +
                `- **Full-res artifact:** **pr-ios-screenshots** (before/ + after/)\n` +
                `\n_Targets: \`${targets}\`. Assert each screen renders as intended before merging._\n`
            });
        env:
          DEPTH_SHOT_TARGETS: ${{ steps.targets.outputs.targets }}
          BEFORE_URL: ${{ steps.upload.outputs.before_url }}
          AFTER_URL: ${{ steps.upload.outputs.after_url }}
