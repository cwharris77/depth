name: CI

# Runs the format check, unit suite, and a typecheck on every PR and on pushes to
# main. Build is
# intentionally not run here: `next build` calls generateStaticParams -> the Supabase
# RosterSource, which needs project secrets this workflow doesn't carry. The live DB
# tests (lib/__tests__/roster-source.db.test.ts) skip gracefully without those env vars,
# so the suite stays green on secretless PRs while still guarding the pure logic.
#
# The ios-compat job runs the iOS backend-compatibility guard
# (scripts/check-ios-compatibility.mts) on every run: it flags destructive migrations
# that break installed App Store builds unless they carry a compatibility annotation
# and update ios-release-compatibility.md. It needs a
# full clone (fetch-depth: 0) so the PR base SHA resolves for the diff.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The Next.js app + shared backend live under web/ now — see the header comment.
    defaults:
      run:
        working-directory: web
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check public source comments
        env:
          PUBLIC_COMMENT_DENYLIST: ${{ secrets.PUBLIC_COMMENT_DENYLIST }}
        run: npm run check:public-comments -- --all
      # The public-comments check above also scans Markdown, so it always runs. Format,
      # typecheck and unit tests are skipped on PRs that only change Markdown files other
      # than ios-release-compatibility.md (read by the migration-compat code and tests).
      # The job still reports, so it works as a required status check.
      - name: Detect code changes
        id: code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$([ -n "$BASE_SHA" ] && git diff --name-only "$BASE_SHA" HEAD)
          if [ -z "$files" ] || grep -Ev '\.md$' <<<"$files" >/dev/null || grep -qx 'ios-release-compatibility.md' <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.code.outputs.changed == 'true'
        run: npm run format:check
      - if: steps.code.outputs.changed == 'true'
        run: npx tsc --noEmit
      - if: steps.code.outputs.changed == 'true'
        run: npm test

  ios-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Guard migrations against installed App Store builds
        run: npm run check:ios-compat -- --base ${{ github.event.pull_request.base.sha || github.event.before }}
