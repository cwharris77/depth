name: Ingest nflverse data

# Recurring nflverse ingestion (player season stats). Wraps `npm run ingest:nflverse`
# on a daily schedule, plus a manual
# trigger. STRICT=1 so a
# partial run (a season failed to write) turns the workflow red instead of silently
# going green with half-stale data.
#
# Runs production first, then the dedicated staging project (djwrecczgudktgsooxti) via
# mirror steps that override SUPABASE_URL/SUPABASE_SECRET_KEY — see the staging steps'
# comment. The staging run needs STAGING_SUPABASE_URL / STAGING_SUPABASE_SECRET_KEY;
# until those secrets exist the steps fail loudly, while production is unaffected.
#
# The `stat-files` job is independent of `ingest`: it builds the per-player stat files
# from the same nflverse sources and publishes them to R2 (production bucket, then the
# staging bucket). It shares no steps with the Supabase ingest, so a failure in either
# never skips or rolls back the other, and each target records its own `ingestion_runs`
# row (source `stat-files`).

on:
  schedule:
    # Twice daily, each slot an hour after the matching ESPN ingest run
    # (ingest-espn.yml, 15:00 and 20:00 UTC) so the two never interleave in
    # ingestion_runs. Cron is fixed UTC, so these drift together with ESPN's under DST
    # — the 1-hour stagger holds regardless.
    #
    # 9am PT morning run so night-game results land before morning instead of waiting for
    # the next afternoon. The one-hour stagger follows the source publish lag.
    - cron: '0 16 * * *'
    # 1pm PT afternoon run — the original daily slot.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Season range to backfill, e.g. 1999-2025. Empty = daily run (ingest:nflverse current + previous, ingest:rosters current season only).'
        type: string
        required: false
        default: ''
      stat_files:
        description: 'Which R2 bucket(s) the stat-files job publishes to.'
        type: choice
        options: [both, staging, production, skip]
        default: both
      team_files:
        description: 'Also build and publish the per-team stat files (v1/teams/). Off for scheduled runs.'
        type: boolean
        default: false
      record_files:
        description: 'Also build and publish the league record and player highlight stat files (v1/records/, v1/players/*/highlights.json). Always built on scheduled runs.'
        type: boolean
        default: false
      stat_files_only:
        description: 'Skip the Supabase ingest job and run only the stat-files job.'
        type: boolean
        default: false

# Never let two ingestions overlap (a slow run + the next schedule, or a manual
# dispatch during a scheduled one).
concurrency:
  group: ingest-nflverse
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ !inputs.stat_files_only }}
    runs-on: ubuntu-latest
    # Next.js app + shared backend live under web/ now — see ingest-espn.yml.
    defaults:
      run:
        working-directory: web
    # A full `--seasons 1999-2026` backfill now also lands every Layer-1 source table
    # (~250 source downloads + several hundred thousand upsert rows, twice: prod then the
    # staging mirror). The pre-source-layer run finished in under a minute; 30 minutes is
    # not enough headroom for the backfill.
    timeout-minutes: 90
    env:
      # A full backfill parses a whole season of wide source files; the default V8 heap
      # ceiling (~4 GB) leaves little headroom for the backfill.
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Manual dispatch's `seasons` input backfills both this step and ingest:rosters
      # below (shared range, no per-dataset granularity). Empty input (the scheduled
      # daily run) falls through to the plain command -- ingest:nflverse's default is
      # current + previous season, ingest:rosters' default is current season only.
      - run: |
          if [ -n "$SEASONS" ]; then
            npm run ingest:nflverse -- --seasons "$SEASONS"
          else
            npm run ingest:nflverse
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Last step on a successful run POSTs to app/api/ingest/revalidate so the
          # deployed app doesn't wait out the `ingest` cacheLife profile's 6h window
          # Missing either var is a
          # silent no-op (notify-revalidate.ts), never a failed run. ingest:rosters
          # below doesn't call this — the daily job always runs ingest:nflverse first
          # in the same job, so one revalidate call (tagged ingest:nflverse) already
          # covers roster-history reads too.
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_REVALIDATE_SECRET: ${{ secrets.INGEST_REVALIDATE_SECRET }}
          STRICT: '1'
      # Production roster-history ingest. Runs before the staging mirrors so a staging
      # failure can never skip it. Doesn't call revalidate itself — the ingest:nflverse
      # step above already did (tagged ingest:nflverse, which covers roster-history reads).
      - run: |
          if [ -n "$SEASONS" ]; then
            npm run ingest:rosters -- --seasons "$SEASONS"
          else
            npm run ingest:rosters
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STRICT: '1'
      # Staging mirrors — same two ingest commands against the dedicated staging project
      # (djwrecczgudktgsooxti) so the staging-backed iOS suites and App Store captures
      # read fresh data. Overrides the same two env vars the scripts read, so no script
      # change. No APP_URL / INGEST_REVALIDATE_SECRET: staging has no deployed app, and
      # notify-revalidate no-ops without them, so prod's cache is never revalidated here.
      - name: Ingest nflverse data (staging)
        run: |
          if [ -n "$SEASONS" ]; then
            npm run ingest:nflverse -- --seasons "$SEASONS"
          else
            npm run ingest:nflverse
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STRICT: '1'
      - name: Ingest rosters (staging)
        run: |
          if [ -n "$SEASONS" ]; then
            npm run ingest:rosters -- --seasons "$SEASONS"
          else
            npm run ingest:rosters
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STRICT: '1'

  stat-files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # A full 1999-onward backfill fetches ~250 source files and uploads ~63k objects.
    timeout-minutes: 90
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Empty `seasons` (the scheduled run) rebuilds the current window and reads every
      # other season's checkpoint from the bucket; a range rebuilds exactly that range.
      # Nothing is uploaded until every season is built and has passed the shrink guard.
      - name: Publish stat files (production)
        if: ${{ inputs.stat_files != 'staging' && inputs.stat_files != 'skip' }}
        run: |
          FLAGS=""
          if [ "$TEAM_FILES" = "true" ]; then FLAGS="--teams"; fi
          # Scheduled runs always build record files: the event detector reads them.
          if [ "$RECORD_FILES" = "true" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then FLAGS="$FLAGS --records"; fi
          if [ -n "$SEASONS" ]; then
            npm run stat-files:build -- --target r2 --bucket "$R2_BUCKET" --seasons "$SEASONS" $FLAGS
          else
            npm run stat-files:build -- --target r2 --bucket "$R2_BUCKET" $FLAGS
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          TEAM_FILES: ${{ inputs.team_files }}
          RECORD_FILES: ${{ inputs.record_files }}
          R2_BUCKET: ${{ vars.R2_BUCKET_PROD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Staging runs even when the production publish fails, so one target's failure
      # never hides the other's result.
      - name: Publish stat files (staging)
        if: ${{ !cancelled() && inputs.stat_files != 'production' && inputs.stat_files != 'skip' }}
        run: |
          FLAGS=""
          if [ "$TEAM_FILES" = "true" ]; then FLAGS="--teams"; fi
          # Scheduled runs always build record files: the event detector reads them.
          if [ "$RECORD_FILES" = "true" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then FLAGS="$FLAGS --records"; fi
          if [ -n "$SEASONS" ]; then
            npm run stat-files:build -- --target r2 --bucket "$R2_BUCKET" --seasons "$SEASONS" $FLAGS
          else
            npm run stat-files:build -- --target r2 --bucket "$R2_BUCKET" $FLAGS
          fi
        env:
          SEASONS: ${{ inputs.seasons }}
          TEAM_FILES: ${{ inputs.team_files }}
          RECORD_FILES: ${{ inputs.record_files }}
          R2_BUCKET: ${{ vars.R2_BUCKET_STAGING }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
