name: Check for new uniform releases

# Recurring monitor for new NFL uniform unveilings (SportsLogos.net News only). Wraps
# `npm run check:uniform-releases` on a monthly schedule, plus a manual trigger.
#
# Runs on a SELF-HOSTED runner because SportsLogos.net's Cloudflare WAF blocks
# GitHub-hosted runner egress while the self-hosted network can reach the site.
#
# On a hit the script appends one line per unveiling to the configured inbox file. It does
# not open GitHub issues; the inbox is the handoff point for later triage.

on:
  schedule:
    # 08:00 UTC on the 1st. Monthly is enough -- unveilings arrive in bursts a few times a
    # year, and the dedupe table means a late check never misses one.
    - cron: '0 8 1 * *'
  workflow_dispatch: {}

# Never let two checks overlap (a slow run + the next schedule, or a manual dispatch
# during a scheduled one) -- avoids racing inserts into uniform_release_watches.
concurrency:
  group: check-uniform-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, macos, arm64]
    # Next.js app + shared backend live under web/ now (uniforms live in lib/uniforms).
    defaults:
      run:
        working-directory: web
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The inbox working copy on the self-hosted runner's host. Overridable with a repo
      # variable; this job only edits the inbox file and does not commit the change.
      - name: Resolve the vault path
        run: echo "OBSIDIAN_VAULT_PATH=${OVERRIDE:-$HOME/Documents/GitHubProjects/obsidian}" >> "$GITHUB_ENV"
        env:
          OVERRIDE: ${{ vars.OBSIDIAN_VAULT_PATH }}
      # Fail loudly rather than letting the script fall back to printing: a monthly job
      # that silently stops filing is difficult to detect.
      - name: Verify the vault inbox is reachable
        run: test -f "$OBSIDIAN_VAULT_PATH/System/Inbox.md"
      - run: npm run check:uniform-releases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
