name: iOS CI

# Builds and tests the native app (ios/) on every PR/push, plus a nightly full-suite run.
# A PR (and a plain push to main) runs a fast smoke set (unit tests + the flagship
# journey + reorder/auth UI suites); the full unit + UI suite runs only on the nightly
# schedule — the slow UI journeys (Accessibility/Performance/Share and the extra
# DepthUITests journeys) give PRs little signal but dominate wall time. Full suite used
# to run on every push to main instead of nightly, but on a day with several PRs merging
# back to back, `concurrency.cancel-in-progress` below kills each run's `ui` leg the
# moment the next push lands — most of those ~20-30min runs never got to finish, pure
# wasted compute. A nightly cron always runs to completion since nothing else contends
# for the same concurrency group at that hour. Build and test are split into separate
# jobs: `build-for-testing` compiles once, then `test` fans out DepthTests and
# DepthUITests into two parallel legs against the prebuilt products
# (`test-without-building`) instead of running them serialized in one `xcodebuild test`
# invocation — this is the dominant wall-time lever since UI tests relaunch the app
# per-test and previously always ran after unit tests finished. The one test leg runs on
# a single current-flagship simulator. The "Staging" configuration is
# DEBUG_BUILD_SETTINGS: all of Debug/Staging/Release point at the single production
# Supabase project (jiqoaqmzmvtovimnmbzl, see ios/xcconfig/Staging.xcconfig's DEP-40 Lane B
# TODO) — there is no dedicated staging project, so every UI journey here reads/writes the
# real production dataset. RLS/native-auth integration suites
# (DepthTests/SupabaseRLSIntegrationTests, DepthTests/NativeAuthIntegrationTests) need a
# local Supabase stack (`supabase start`, which needs Docker); GitHub-hosted macOS
# runners can't run Docker (no nested virtualization), so those suites self-gate on a
# reachability probe and skip cleanly here — see LocalSupabase.isReachable in
# ios/DepthTests/SupabaseRLSIntegrationTests.swift. Full coverage still runs locally
# before every merge per the native iOS plan's verification command.

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  # Full DepthUITests suite, once a day — see the header comment above for why this
  # isn't on every push. Path filters don't apply to schedule triggers, so this always
  # runs regardless of whether ios/ changed that day; harmless, it's one run.
  schedule:
    - cron: '0 8 * * *'
  # Manual full-suite run, on demand — same parallel fan-out as the nightly cron.
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-devices:
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        name: Resolve test device from installed simulator device types
        run: |
          set -euo pipefail

          # `simctl list devicetypes` (no -j) is indentation-sensitive plain text whose
          # exact formatting isn't guaranteed across Xcode versions/runners — a first cut
          # of this step parsed that text with grep/sed/awk/sort and silently aborted on
          # a GitHub-hosted runner (pipefail treats a non-matching grep inside a pipeline
          # as pipeline failure, so `set -e` exited before the fallback error even
          # printed). `-j` gives stable, versioned JSON instead; parse with jq only.
          TYPES_JSON=$(xcrun simctl list devicetypes -j)

          RUNTIME=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version) | last | .identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "null" ]; then
            echo "::error::No available iOS simulator runtime found on this runner."
            exit 1
          fi

          # A device type being *installed* doesn't mean it's *creatable* against the
          # newest runtime — Apple periodically drops old hardware templates from new
          # runtimes (confirmed locally: iPhone XS/XR device types exist but
          # `simctl create` rejects them as "Incompatible device" against iOS 26.5).
          # Test-create (and immediately delete) each candidate in order and use the
          # first that actually succeeds, instead of trusting presence in the type list.
          try_create() {
            local name="$1"
            local device_id
            if device_id=$(xcrun simctl create "compat-check-$$-$RANDOM" "$name" "$RUNTIME" 2>/dev/null); then
              xcrun simctl delete "$device_id" >/dev/null 2>&1 || true
              echo "$device_id" # non-empty on success, used only as a truthy marker
              return 0
            fi
            return 1
          }

          # Current flagship: highest-numbered plain "iPhone N" or "iPhone N Pro" device
          # type that's both installed and creatable (skips Plus/Max/mini/e variants),
          # trying candidates newest-first.
          CANDIDATES=$(echo "$TYPES_JSON" | jq -r '
            [.devicetypes[]
              | select(.productFamily == "iPhone" and (.name | test("^iPhone [0-9]+( Pro)?$")))
              | {name, num: (.name | capture("^iPhone (?<n>[0-9]+)") | .n | tonumber)}]
            | sort_by(-.num) | .[].name
          ')
          NEW_DEVICE=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if try_create "$candidate" >/dev/null; then
              NEW_DEVICE="$candidate"
              break
            fi
          done <<< "$CANDIDATES"
          if [ -z "$NEW_DEVICE" ]; then
            echo "::error::No current-flagship candidate simulator device type is both installed and creatable against runtime $RUNTIME on this runner."
            echo "$TYPES_JSON" | jq -r '.devicetypes[].name'
            exit 1
          fi

          MATRIX=$(jq -nc \
            --arg new "$NEW_DEVICE" \
            --arg runtime "$RUNTIME" \
            '{include: [
              {label: "current", device: $new, runtime: $runtime}
            ]}')
          echo "Resolved test device: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-for-testing:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      # Pinned to commit SHAs, not mutable tags — an upstream tag move would otherwise
      # silently change what runs with this job's inherited token and checked-out
      # source (Greptile P2 on this PR's first review).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Verify checked-in project matches project.yml
        run: |
          if ! git diff --exit-code -- ios/Depth.xcodeproj; then
            echo "::error::ios/Depth.xcodeproj is out of sync with ios/project.yml — run 'xcodegen generate' in ios/ and commit the regenerated project."
            exit 1
          fi

      # The whole app is rebuilt from scratch on every PR otherwise — a cold build
      # dominates wall time. Cache DerivedData so an unchanged codebase resumes from
      # the prior build instead of recompiling everything. Keyed on the iOS sources +
      # this workflow (so a project.yml / xcodegen change invalidates it); on a source
      # change we fall back to the most recent cache and save a fresh one, so
      # sequential small PRs stay incremental.
      - name: Restore DerivedData cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/DerivedData
          key: ${{ runner.os }}-ios-deriveddata-${{ hashFiles('ios/**', '.github/workflows/ios-ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-ios-deriveddata-

      # Compiled once here, no simulator needed (generic destination) — `test` fans
      # this out into parallel unit/UI legs via `test-without-building` instead of
      # every leg repeating this compile serially.
      - name: Build for testing (Staging config)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Depth.xcodeproj \
            -scheme Depth \
            -configuration Staging \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/DerivedData \
            build-for-testing

      - name: Upload build products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-products
          path: ios/DerivedData/Build/Products
          retention-days: 1

  test:
    needs: [resolve-devices, build-for-testing]
    runs-on: macos-latest
    # This PR/push job only runs the fast smoke set (unit + 4 UI classes), which finishes
    # in ~11m — 15 flat leaves headroom for slow-runner noise and lets a hung run fail
    # fast instead of eating 30 minutes. The slow full DepthUITests suite is not run here
    # at all: it previously blew this exact 15-min budget mid-PerformanceUITests
    # (confirmed on a push-triggered full-suite run), which is precisely why the full
    # suite now lives in the nightly `test-full-suite` job below, fanned out across
    # parallel simulator legs with its own 25-minute allowance.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: [unit, ui]
    steps:
      # DepthTests/FixtureLoading.swift reads fixtures/domain/*.json off disk via a
      # #filePath-relative walk-up baked into the test binary at compile time, not as
      # bundled test resources — this job needs the repo checked out at the same
      # conventional runner path build-for-testing used, or FormationsParityTests fails
      # with the fixture files missing (not a flake — every run without this fails).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download build products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-products
          path: ios/DerivedData/Build/Products

      # A PR and a plain push to main both get a fast smoke set: the unit tests plus the
      # single flagship chart→team→player journey, the reorder suite, and auth. The
      # other DepthUITests journeys (schedule, page-switcher, unit-tab tap targets,
      # history, tab bar, relaunch-restore) each relaunch the app against production and
      # dominate wall time while adding little per-push signal — they, like
      # Accessibility/Performance/Share, run only on the nightly schedule (see the
      # header comment for why not on every push).
      - name: Determine test scope
        id: scope
        run: |
          if [ "${{ matrix.leg }}" = "unit" ]; then
            echo "tests=-only-testing:DepthTests" >> "$GITHUB_OUTPUT"
          else
            echo "tests=-only-testing:DepthUITests/DepthUITests/testAppLaunches -only-testing:DepthUITests/DepthUITests/testLaunchesIntoAChartThenSwitchesTeamAndOpensPlayerDetail -only-testing:DepthUITests/PlayerCardReorderUITests -only-testing:DepthUITests/AuthUITests" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ matrix.leg }} tests (Staging config)
        uses: ./.github/actions/run-ios-suite
        with:
          device: ${{ fromJson(needs.resolve-devices.outputs.matrix).include[0].device }}
          runtime: ${{ fromJson(needs.resolve-devices.outputs.matrix).include[0].runtime }}
          sim-name: ci-${{ matrix.leg }}
          tests: ${{ steps.scope.outputs.tests }}

  # The nightly full DepthUITests suite. Fan-out across parallel simulator legs is the
  # dominant wall-time lever (the header comment applies it between unit/UI; this job
  # applies the same idea *within* the UI suite): the ~15 slow production-backed
  # journeys that are deliberately excluded from PR smoke runs each relaunch the app
  # and re-fetch snapshots, so serialized they previously pushed one 15-min flat budget
  # past its limit mid-PerformanceUITests (see the `test` job's comment). Splitting
  # DepthUITests across the `slices` below, each on its own matrix job/VM running
  # `test-without-building` against the single prebuilt product set, caps wall time at
  # the slowest slice instead of the sum. GitHub-hosted macOS runners boot a handful of
  # simulators comfortably, and `fail-fast: false` lets a slow slice finish without
  # cancelling its siblings. The `workflow_dispatch` trigger runs this same fan-out on
  # demand.
  #
  # Slice partition (each named slice covers disjoint classes; the union is the full
  # DepthUITests target). AppStoreScreenshotsUITests and PRScreenshotsUITests are
  # deliberately left out — they are on-demand capture tools with their own schemes, not
  # correctness gates (see project.yml's skippedTests), so they never run in the nightly
  # fan-out either.
  test-full-suite:
    needs: [resolve-devices, build-for-testing]
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The flagship journeys: 14 tests, the largest class — its own leg so a slow
          # journey can't stall reorder/a11y/etc.
          - slice: journeys
            tests: -only-testing:DepthUITests/DepthUITests
          # DEP-226 reorder persistence + edit-mode + formation: each test does a
          # production-backed drag gesture, the jankiest (and slowest) interaction here.
          - slice: reorder
            tests: -only-testing:DepthUITests/PlayerCardReorderUITests
          # Dynamic-type/motion announcements: heavy simulator accessibility work.
          - slice: a11y
            tests: -only-testing:DepthUITests/AccessibilityUITests
          # Everything else — auth, share, performance — grouped so none dominates.
          - slice: auth-share-perf
            tests: >-
              -only-testing:DepthUITests/AuthUITests
              -only-testing:DepthUITests/ShareUITests
              -only-testing:DepthUITests/PerformanceUITests
    steps:
      # Same fixture-filesystem requirement as the `test` job — needs the checkout at
      # the conventional runner path build-for-testing used.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download build products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-products
          path: ios/DerivedData/Build/Products

      - name: Run DepthUITests slice (${{ matrix.slice }})
        uses: ./.github/actions/run-ios-suite
        with:
          device: ${{ fromJson(needs.resolve-devices.outputs.matrix).include[0].device }}
          runtime: ${{ fromJson(needs.resolve-devices.outputs.matrix).include[0].runtime }}
          sim-name: full-${{ matrix.slice }}
          tests: ${{ matrix.tests }}

  archive-secret-check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Same pin as the `test` job above — see its comment for why.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Verify checked-in project matches project.yml
        run: |
          if ! git diff --exit-code -- ios/Depth.xcodeproj; then
            echo "::error::ios/Depth.xcodeproj is out of sync with ios/project.yml — run 'xcodegen generate' in ios/ and commit the regenerated project."
            exit 1
          fi

      - name: Matcher self-test
        run: ios/scripts/inspect-archive-secrets.sh --self-test

      # Builds an unsigned Release configuration for the simulator SDK and scans
      # Info.plist + the compiled binary for any service-role-shaped Supabase secret —
      # enforces the hard rule in AGENTS.md that no service-role key ever ships in the
      # app bundle. See ios/scripts/inspect-archive-secrets.sh for the full rationale.
      - name: Inspect built archive for leaked secrets
        run: ios/scripts/inspect-archive-secrets.sh
