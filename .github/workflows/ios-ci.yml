name: iOS CI

# Builds and tests the native app (ios/) on every PR/push. Runs a small device matrix
# (an oldest-supported-class simulator and the newest available flagship simulator) per
# the native iOS plan's T9 requirement. RLS/native-auth integration suites
# (DepthTests/SupabaseRLSIntegrationTests, DepthTests/NativeAuthIntegrationTests) need a
# local Supabase stack (`supabase start`, which needs Docker); GitHub-hosted macOS
# runners can't run Docker (no nested virtualization), so those suites self-gate on a
# reachability probe and skip cleanly here — see LocalSupabase.isReachable in
# ios/DepthTests/SupabaseRLSIntegrationTests.swift. Full coverage still runs locally
# before every merge per the native iOS plan's verification command.

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-devices:
    runs-on: macos-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        name: Resolve device matrix from installed simulator device types
        run: |
          set -euo pipefail

          # Oldest-supported-class approximation: the design spec's performance budgets
          # target "iPhone XS/XR-class" devices, but those device types are no longer
          # creatable against current iOS simulator runtimes (Apple drops old hardware
          # templates from new runtimes). Fall through a list of the smallest/oldest
          # device types that are still commonly creatable, oldest first.
          OLD_CANDIDATES=(
            "iPhone SE (3rd generation)"
            "iPhone SE (2nd generation)"
            "iPhone 12 mini"
            "iPhone 13 mini"
            "iPhone 12"
          )
          OLD_DEVICE=""
          for d in "${OLD_CANDIDATES[@]}"; do
            if xcrun simctl list devicetypes | grep -qF "$d ("; then
              OLD_DEVICE="$d"
              break
            fi
          done
          if [ -z "$OLD_DEVICE" ]; then
            echo "::error::No oldest-class candidate simulator device type is installed on this runner."
            exit 1
          fi

          # Current flagship: highest-numbered plain "iPhone N" or "iPhone N Pro" device
          # type installed (skips Plus/Max/mini/e variants, which aren't a meaningful
          # second matrix leg alongside the oldest-class device above).
          NEW_DEVICE=$(xcrun simctl list devicetypes \
            | grep -E '^    iPhone [0-9]+( Pro)? \(' \
            | sed -E 's/^    (iPhone [0-9]+( Pro)?) \(.*/\1/' \
            | awk '{print $2, $0}' | sort -n -r | cut -d' ' -f2- \
            | head -1)
          if [ -z "$NEW_DEVICE" ]; then
            echo "::error::No current-flagship candidate simulator device type is installed on this runner."
            exit 1
          fi

          MATRIX=$(jq -nc \
            --arg old "$OLD_DEVICE" \
            --arg new "$NEW_DEVICE" \
            '{include: [{label: "oldest-supported", device: $old}, {label: "current", device: $new}]}')
          echo "Resolved device matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-devices
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-devices.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Verify checked-in project matches project.yml
        run: |
          if ! git diff --exit-code -- ios/Depth.xcodeproj; then
            echo "::error::ios/Depth.xcodeproj is out of sync with ios/project.yml — run 'xcodegen generate' in ios/ and commit the regenerated project."
            exit 1
          fi

      - name: Boot ${{ matrix.label }} simulator (${{ matrix.device }})
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | sort_by(.version) | last | .identifier')
          if [ -z "$RUNTIME" ] || [ "$RUNTIME" = "null" ]; then
            echo "::error::No available iOS simulator runtime found on this runner."
            exit 1
          fi
          DEVICE_ID=$(xcrun simctl create "ci-${{ matrix.label }}" "${{ matrix.device }}" "$RUNTIME")
          xcrun simctl boot "$DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit + UI tests (Staging config)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Depth.xcodeproj \
            -scheme Depth \
            -configuration Staging \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}" \
            test
