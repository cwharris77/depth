name: Run iOS test suite (test-without-building)
description: |
  Downloads the build-for-testing products, boots the selected simulator, and runs a
  `test-without-building` leg with the given `-only-testing` slice. Shared by the PR/push
  `test` job and the nightly `test-full-suite` job so both fan out parallel legs against
  the single prebuilt product set without duplicating the boilerplate.
inputs:
  # Simulator device type (e.g. "iPhone 17 Pro") — resolved as creatable against
  # `runtime` by the resolve-devices job, same guarantee both callers rely on.
  device:
    description: Simulator device type to create.
    required: true
  runtime:
    description: Simulator runtime identifier to create against.
    required: true
  # Unique instance name per parallel leg so the matrix simulators in one job don't
  # collide; each call creates + boots its own device.
  sim-name:
    description: Unique name for the simulator device created by this leg.
    required: true
  # Space-separated `-only-testing:...` args. May be empty to run every test in the
  # prebuilt bundle.
  tests:
    description: Space-separated -only-testing slice (may be empty string).
    required: false
    default: ''
  # Per-test limit in seconds. A test that runs past it fails by name (XCTest captures a
  # spindump) and the run moves on to the next test, instead of the whole job hitting its
  # timeout with no indication of which test stalled. XCTest rounds it up to a whole
  # minute. Sized above the slowest nightly test (~4.5 min at accessibility sizes).
  test-time-allowance:
    description: Seconds each test may run before XCTest fails it.
    required: false
    default: '300'
  # Reruns a failed test once. UI legs only: hosted macOS runners intermittently stall the
  # simulator's accessibility and launch services (kAXErrorIPCTimeout, "Timed out while
  # launching app", 15-30s element queries right after launch), failing a test that passes
  # on the next attempt; a real regression fails both. Not for DepthTests: Swift Testing
  # reruns the whole run in one process, and SnapshotTesting then names the second capture
  # `<test>.2.png`, finds no reference and fails.
  retry-on-failure:
    description: Rerun a failed test once ('true' or 'false').
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # actions/download-artifact writes files tagged com.apple.quarantine (they arrived
    # over HTTPS) — Gatekeeper then does a full recursive codesign re-verification of
    # the .app bundle the first time the simulator installs it, a cost a locally-built
    # .app never pays. Observed as a multi-minute silent stall between xcodebuild
    # starting and the first test case actually running. Strip it before testing.
    - name: Clear quarantine attribute on downloaded build products
      run: xattr -cr DerivedData/Build/Products
      shell: bash

    - name: Boot ${{ inputs.sim-name }} simulator (${{ inputs.device }})
      id: sim
      env:
        DEVICE: ${{ inputs.device }}
        RUNTIME: ${{ inputs.runtime }}
        SIM_NAME: ${{ inputs.sim-name }}
      run: |
        set -euo pipefail
        # Device/runtime pair was already validated as creatable in resolve-devices —
        # reuse it directly instead of re-resolving the runtime (which could in
        # principle pick up a different image/runtime set on this runner).
        DEVICE_ID=$(xcrun simctl create "$SIM_NAME" "$DEVICE" "$RUNTIME")
        xcrun simctl boot "$DEVICE_ID"
        echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Run tests${{ inputs.tests != '' && format(' ({0})', inputs.sim-name) || '' }}
      env:
        DEVICE_ID: ${{ steps.sim.outputs.device_id }}
        TESTS: ${{ inputs.tests }}
        ALLOWANCE: ${{ inputs.test-time-allowance }}
        RETRY: ${{ inputs.retry-on-failure }}
      run: |
        set -o pipefail
        XCTESTRUN=$(find DerivedData/Build/Products -maxdepth 1 -name '*.xctestrun' | head -n1)
        if [ -z "$XCTESTRUN" ]; then
          echo "::error::No .xctestrun file found in downloaded build products."
          exit 1
        fi
        RETRY_ARGS=""
        if [ "$RETRY" = "true" ]; then
          RETRY_ARGS="-retry-tests-on-failure -test-iterations 2"
        fi
        # `$TESTS` and `$RETRY_ARGS` expand to whitespace-separated args; empty is fine.
        # shellcheck disable=SC2086
        xcodebuild \
          -xctestrun "$XCTESTRUN" \
          -destination "platform=iOS Simulator,id=$DEVICE_ID" \
          $RETRY_ARGS \
          -test-timeouts-enabled YES \
          -default-test-execution-time-allowance "$ALLOWANCE" \
          -maximum-test-execution-time-allowance "$ALLOWANCE" \
          test-without-building $TESTS
      shell: bash
