# Categorization for GitHub's auto-generated release notes. This is the repo's ONLY
# changelog mechanism: cut a release (or `gh release create <tag> --generate-notes`) and
# GitHub groups the PRs merged since the previous tag into the categories below, keyed on
# the labels auto-label-prs.yml applies from each PR's conventional-commit title.
#
# A committed CHANGELOG.md + a workflow that regenerated it on every push to main used to
# exist alongside this file. It was removed: it duplicated this mechanism, pushed a bot
# commit to main per merge, and listed those bot commits in its own output. Nothing here
# writes to the repo — the notes are rendered at release time and live on the release.
#
# Categories are matched in order and a PR lands in the FIRST one it matches, so the type
# labels must stay above any broader label (see the '*' catch-all last).

changelog:
  exclude:
    labels:
      - wontfix
      - invalid
      - duplicate
      - question
    authors:
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feature
    # Above Bug Fixes deliberately: a PR carrying both (a hand-added `design` on a
    # `fix:` title) is a look change, not a defect, and first-match decides.
    - title: Design & Polish
      labels:
        - design
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Refactoring
      labels:
        - refactor
    - title: Accessibility
      labels:
        - a11y
    - title: Chores
      labels:
        - chore
    - title: CI
      labels:
        - ci
    - title: Other Changes
      labels:
        - '*'
