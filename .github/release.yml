changelog:
  exclude:
    labels:
      - wontfix
      - invalid
      - duplicate
      - question
    authors:
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feature
    - title: Bug Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Refactoring
      labels:
        - refactor
    - title: Accessibility
      labels:
        - a11y
    - title: Chores
      labels:
        - chore
    - title: CI
      labels:
        - ci
    - title: Other Changes
      labels:
        - '*'
